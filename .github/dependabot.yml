version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # don't propose releases younger than a week (supply-chain attacks are usually caught by then)
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Minor/patch updates are grouped; each major upgrade gets its own PR to review and test.
      dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
